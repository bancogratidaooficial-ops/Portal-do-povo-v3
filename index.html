<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#FFD700 0%,#fff8dc 20%,#f5f5f5 100%);font-family:Arial;padding-bottom:90px}
.top{padding:14px;background:#111;border-bottom:4px solid #FFD700;text-align:center;position:sticky;top:0;z-index:30}
.top h1{margin:0;color:#FFD700;font-size:20px;font-weight:900}
.cat{margin:18px 10px 8px;padding:9px 12px;font-weight:900;background:linear-gradient(90deg,#FFD700,#FFC400);border-radius:9px;font-size:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 10px}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr 1fr 1fr}}
.card{border-radius:12px;overflow:hidden;background:#fff;border:2px solid #FFD700;height:100px;position:relative;box-shadow:0 3px 8px rgba(0,0,0,.1);text-decoration:none;display:block}
.card img{width:100%;height:58px;object-fit:cover}
.card-info{padding:5px 7px;height:38px;background:#fff}
.card-info b{font-size:8.5px;color:#111;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-info span{font-size:6.5px;color:#666}
.ad-small{background:#fff;border:1px dashed #FFD700;border-radius:8px;padding:6px;text-align:center;margin:10px auto;max-width:320px;max-height:70px;overflow:hidden}
.ad-small small{font-size:7px;color:#999;display:block}
/* BOTÕES FLUTUANTES UM DE CADA LADO */
#btnInstalar{position:fixed;bottom:16px;right:10px;background:#111;color:#FFD700;padding:11px 18px;border-radius:30px;font-weight:900;font-size:12px;z-index:9999;border:2px solid #FFD700;box-shadow:0 4px 12px rgba(0,0,0,.3);cursor:pointer}
#btnCine{position:fixed;bottom:16px;left:10px;background:#fff;color:#111;padding:8px 12px;border-radius:12px;font-weight:900;font-size:10px;z-index:9999;border:2px solid #c62828;box-shadow:0 4px 12px rgba(0,0,0,.2);display:flex;align-items:center;gap:6px;cursor:pointer}
#btnCine img{width:24px;height:24px;border-radius:4px}
</style>
</head>
